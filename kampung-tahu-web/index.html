<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Petualangan di Kampung Tahu</title>
<meta name="description" content="Game edukasi interaktif untuk anak TK: kenali tahu dari kebun kedelai sampai warung sehat.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#2b1b4a;--fg:#fff;--ac:#7b3fe4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1a1030}}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#st{position:relative;width:min(100vw,calc(92vh*16/9));aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;user-select:none;-webkit-user-select:none}
video{width:100%;height:100%;display:block}
.h{position:absolute;border:3px solid transparent;border-radius:12px;cursor:pointer;display:none;z-index:6}
.h.on{display:block}.h.sel{}
.n{position:absolute;top:4px;left:4px;background:#fff;color:#5b2bb8;font-weight:800;border-radius:50%;width:24px;height:24px;display:none;align-items:center;justify-content:center;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.sel .n{display:flex}
#hud{position:absolute;top:8px;right:10px;background:rgba(0,0,0,.55);padding:4px 12px;border-radius:20px;font-weight:700;display:none;z-index:8}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px;display:none;justify-content:center;gap:8px;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:8}
button{font:700 clamp(13px,2.2vw,20px) system-ui;background:var(--ac);color:#fff;border:0;border-radius:24px;padding:8px 20px;cursor:pointer}
#ask{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:62%;text-align:center;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:12px;font-size:clamp(12px,2vw,18px);display:none;z-index:8}
#go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.6);z-index:9}
#go button{font-size:clamp(18px,4vw,34px);padding:14px 40px}
.pb{position:absolute;border-radius:16px;cursor:pointer;z-index:7}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.85)}50%{box-shadow:0 0 0 14px rgba(255,210,63,0)}}
#hint{position:absolute;left:0;right:0;top:8px;text-align:center;display:none;pointer-events:none;font-weight:700;font-size:clamp(12px,2vw,18px);z-index:8}
#hint span{background:rgba(0,0,0,.65);padding:5px 14px;border-radius:14px}
#dg{position:absolute;inset:0;display:none;z-index:3;touch-action:none}
#dg>img.bg{position:absolute;inset:0;width:100%;height:100%}
.pc{position:absolute;cursor:grab;touch-action:none;z-index:4;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.pc:active{cursor:grabbing}
button:disabled{opacity:.65;cursor:wait}
.nobadge .n{display:none!important}
#hint,#bar{display:none!important}
#end{position:absolute;left:0;right:0;bottom:5%;display:none;flex-direction:column;align-items:center;gap:8px;z-index:9}
#end span{background:rgba(0,0,0,.6);padding:4px 14px;border-radius:14px;font-weight:700;font-size:clamp(12px,2vw,18px)}
</style></head><body><div id="st">

let qi=0,sel=[],stars=0,mode='idle',stopAt=null,next=null,wt=null;const done=new Set(),hsEls=[];
Q.forEach((q,i)=>{q.hs.forEach((r,j)=>{const d=document.createElement('div');d.className='h'+(q.nb?'':' nobadge');d.dataset.q=i;d.dataset.j=j;
 d.style.cssText=`left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%`;d.innerHTML='<span class="n"></span>';
 d.onclick=()=>pick(i,j,d);st.appendChild(d);hsEls.push(d)});
 if(q.chk){const r=q.chk,d=document.createElement('div');d.className='h';d.dataset.q=i;d.dataset.j=-1;
  d.style.cssText=`left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%`;d.onclick=()=>{if(mode==='quiz'&&qi===i&&sel.length)evaluate()};st.appendChild(d);hsEls.push(d)}});

const dg=$('#dg');
P.forEach(p=>{const im=new Image();im.src=D.S[p.k];im.className='pc';im.draggable=false;im.style.cssText=`left:${p.x}%;top:${p.y}%;width:${p.w}%`;dg.appendChild(im);p.el=im;
 im.onpointerdown=e=>{e.preventDefault();im.setPointerCapture(e.pointerId);const r=dg.getBoundingClientRect(),b=im.getBoundingClientRect(),ox=e.clientX-b.left,oy=e.clientY-b.top;
  dg.appendChild(im);
  im.onpointermove=ev=>{im.style.left=((ev.clientX-ox-r.left)/r.width*100)+'%';im.style.top=((ev.clientY-oy-r.top)/r.height*100)+'%'};
  im.onpointerup=()=>{im.onpointermove=null;im.onpointerup=null;if(mode==='quiz'&&Q[qi].drag&&P.every(p=>where(p)))setTimeout(evaluate,400)}}});
function where(p){const b=p.el.getBoundingClientRect(),r=dg.getBoundingClientRect(),cx=(b.left+b.width/2-r.left)/r.width*100,cy=(b.top+b.height/2-r.top)/r.height*100;
 if(cy>=68&&cy<=94){if(cx>=6&&cx<=50)return'L';if(cx>=57&&cx<=98)return'R'}return null}
function say(m){const a=$('#ask');a.textContent=m;a.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>a.style.display='none',2600)}
function show(on){const q=Q[qi];hsEls.forEach(d=>d.classList.toggle('on',on&&+d.dataset.q===qi));
 dg.style.display=on&&q&&q.drag?'block':'none';$('#ask').style.display='none'}
function pick(i,j,d){if(mode!=='quiz'||i!==qi)return;const q=Q[qi],k=sel.indexOf(j);
 if(k>=0){sel.splice(k,1);d.classList.remove('sel')}
 else{if(!q.ord&&q.ans.length===1)reset();else if(!q.ord&&sel.length>=q.ans.length)return;sel.push(j);d.classList.add('sel')}
 hsEls.filter(e=>+e.dataset.q===qi&&+e.dataset.j>=0).forEach(e=>{const p=sel.indexOf(+e.dataset.j);e.querySelector('.n').textContent=q.ord?p+1:'✓'});
 if(q.ord&&sel.length===q.ans.length)setTimeout(evaluate,350)}
function reset(){sel=[];hsEls.forEach(d=>d.classList.remove('sel'))}
// Berhenti sampai tombol di video diklik (kotak kuning), lalu jalankan cb
function waitBtn(rects,cb){mode='btn';v.pause();clearPb();
 const fin=()=>{clearTimeout(wt);st.onclick=null;st.style.cursor='';clearPb();$('#hint').style.display='none';cb()};
 rects.forEach(r=>{const d=document.createElement('div');d.className='pb';d.style.cssText=`left:${r[0]}%;top:${r[1]}%;width:${r[2]}%;height:${r[3]}%`;
  d.onclick=e=>{e.stopPropagation();fin()};st.appendChild(d)});
 $('#hint').style.display='block';clearTimeout(wt);wt=setTimeout(()=>{st.style.cursor='pointer';st.onclick=fin},4000)}
function clearPb(){document.querySelectorAll('.pb').forEach(e=>e.remove())}
function clip(a,b,after,rects){v.currentTime=a;stopAt=b;next=()=>waitBtn(rects,after);mode='clip';show(false);v.play()}
$('#rs').onclick=()=>{if(Q[qi].drag)P.forEach(p=>{p.el.style.left=p.x+'%';p.el.style.top=p.y+'%'});else reset()};
function evaluate(){if(mode!=='quiz')return;const q=Q[qi];let good;
 if(q.drag){if(P.some(p=>!where(p))){say('Pindahkan semua tahu ke piring dulu ya!');return}good=P.every(p=>where(p)===(p.t==='w'?'L':'R'))}
 else{if(!sel.length)return;good=q.ord?JSON.stringify(sel)===JSON.stringify(q.ans):(sel.length===q.ans.length&&q.ans.every(a=>sel.includes(a)))}
 if(good){stars++;$('#sc').textContent=stars;clip(q.ok[0],q.ok[1],()=>{qi++;mode='play';v.currentTime=q.resume;v.play()},[q.okBtn||AMBIL])}
 else clip(q.bad[0],q.bad[1],()=>{v.currentTime=q.at;mode='quiz';if(!q.drag)reset();show(true)},[COBA])}
const sb=$('#start');sb.disabled=true;sb.textContent='⏳ Memuat video…';
const rdy=()=>{if(sb.disabled){sb.disabled=false;sb.textContent='▶ Mulai Petualangan'}};
v.addEventListener('canplay',rdy);if(v.readyState>=3)rdy();setTimeout(rdy,20000);
$('#start').onclick=()=>{$('#go').remove();$('#hud').style.display='block';mode='play';v.play()};
setInterval(()=>{const t=v.currentTime;
 if(mode==='clip'&&stopAt!==null&&t>=stopAt){v.pause();stopAt=null;next&&next()}
 else if(mode==='play'&&!v.paused){
  const i=B.findIndex((b,k)=>!done.has(k)&&t>=b[0]&&t<b[0]+1);
  if(i>=0){done.add(i);waitBtn(B[i][1],()=>{mode='play';v.play()});return}
  if(qi<Q.length&&t>=Q[qi].at&&t<Q[qi].at+3){v.pause();mode='quiz';reset();show(true)}}},30);
v.onended=()=>{mode='end';$('#es').textContent='Selesai! Kamu mendapat '+stars+' ⭐ bintang petualang';$('#end').style.display='flex'};
function restart(){clearTimeout(wt);clearTimeout(say.t);st.onclick=null;st.style.cursor='';clearPb();$('#end').style.display='none';$('#ask').style.display='none';
 qi=0;stars=0;$('#sc').textContent=0;done.clear();reset();stopAt=null;next=null;
 P.forEach(p=>{p.el.style.left=p.x+'%';p.el.style.top=p.y+'%'});show(false);
 v.currentTime=0;mode='play';v.play()}
$('#again').onclick=restart;
